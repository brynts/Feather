name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: List Xcode
        run: ls /Applications | grep -i xcode

      - name: Prepare dependencies (Xcode)
        run: |
          ls /Applications | grep -i '^Xcode'
          # Coba Xcode 26.3 dulu (lebih stabil dari 26.2)
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          else
            sudo xcode-select -s /Applications/Xcode_26.2.app
          fi

      - name: Clean SPM / DerivedData (fix Xcode crash)
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData || true
          rm -rf Package.resolved || true
          rm -rf .build SourcePackages || true
          rm -rf /tmp/Feather || true

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Feather.xcodeproj \
            -scheme Feather \
            -clonedSourcePackagesDirPath /tmp/spm-cache || true

      - name: Build
        run: | 
          agvtool new-version -all $(git rev-parse HEAD)
          make

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather
          path: packages/*

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v3.0.2
        with:
          name: Feather v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
